<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RB Ciné</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    [data-theme="dark"]{
      --bg:#08090C;--bg2:#0F1117;--bg3:#181A22;--bg4:#1E2130;
      --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);
      --text:#F0F2FF;--muted:#6B7280;--muted2:#374151;
      --card-bg:#0F1117;--hdr-bg:rgba(8,9,12,0.92);
      --grain:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    }
    [data-theme="light"]{
      --bg:#F8F8FB;--bg2:#FFFFFF;--bg3:#EEEEF4;--bg4:#E4E4EE;
      --border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.14);
      --text:#0D0E18;--muted:#6B7280;--muted2:#9CA3AF;
      --card-bg:#FFFFFF;--hdr-bg:rgba(248,248,251,0.92);
      --grain:none;
    }
    :root{
      --red:#E8402A;--red-l:#FF5C42;--red-d:#B52E1A;
      --gold:#C9A84C;--gold-l:#E8C96A;
      --good:#22C55E;--mid:#EAB308;--bad:#E8402A;
    }

    html{scroll-behavior:smooth}

    body{
      font-family:'Outfit',sans-serif;
      background:var(--bg);color:var(--text);
      min-height:100vh;
      transition:background .4s,color .4s;
      position:relative;
    }

    /* Grain overlay */
    body::before{
      content:'';position:fixed;inset:0;
      background-image:var(--grain);
      background-size:200px 200px;
      pointer-events:none;z-index:999;
      opacity:1;
    }

    /* ===== HEADER ===== */
    header{
      position:sticky;top:0;
      background:var(--hdr-bg);
      backdrop-filter:blur(20px);
      border-bottom:1px solid var(--border);
      z-index:100;
    }
    .hdr{
      max-width:1280px;margin:0 auto;
      padding:0 32px;height:64px;
      display:flex;align-items:center;gap:24px;
    }
    .logo{
      display:flex;align-items:center;gap:12px;
      flex-shrink:0;text-decoration:none;
    }
    .logo-mark{
      font-family:'Bebas Neue',sans-serif;
      font-size:22px;letter-spacing:.08em;
      color:var(--red);
      border:1.5px solid var(--red);
      padding:2px 8px;
      border-radius:4px;
      line-height:1;
    }
    .logo-name{
      font-family:'Bebas Neue',sans-serif;
      font-size:22px;letter-spacing:.12em;
      color:var(--text);
    }
    .logo-name span{color:var(--red)}

    .divider{width:1px;height:28px;background:var(--border2);flex-shrink:0}

    .tabs{display:flex;gap:2px}
    .tab{
      background:transparent;border:none;
      color:var(--muted);
      font-family:'Outfit',sans-serif;
      font-size:13px;font-weight:500;
      letter-spacing:.06em;text-transform:uppercase;
      padding:8px 18px;
      border-radius:6px;cursor:pointer;
      transition:all .2s;
    }
    .tab.on{
      background:var(--red);color:#fff;
      box-shadow:0 0 20px rgba(232,64,42,.3);
    }
    .tab:not(.on):hover{color:var(--text);background:var(--bg3)}

    .search-row{
      display:flex;gap:8px;flex:1;
      max-width:360px;margin-left:auto;
    }
    .search-row input{
      flex:1;
      background:var(--bg3);
      border:1px solid var(--border);
      border-radius:8px;
      padding:9px 14px;
      color:var(--text);
      font-family:'Outfit',sans-serif;
      font-size:14px;outline:none;
      transition:border-color .2s,box-shadow .2s;
    }
    .search-row input::placeholder{color:var(--muted2)}
    .search-row input:focus{
      border-color:var(--red);
      box-shadow:0 0 0 3px rgba(232,64,42,.1);
    }
    .search-row button{
      background:var(--red);border:none;
      border-radius:8px;padding:9px 20px;
      color:#fff;
      font-family:'Outfit',sans-serif;
      font-size:13px;font-weight:600;
      letter-spacing:.04em;text-transform:uppercase;
      cursor:pointer;
      transition:background .2s,box-shadow .2s,transform .1s;
      white-space:nowrap;
    }
    .search-row button:hover{
      background:var(--red-l);
      box-shadow:0 4px 20px rgba(232,64,42,.35);
    }
    .search-row button:active{transform:scale(.97)}

    .theme-btn{
      width:36px;height:36px;
      background:var(--bg3);
      border:1px solid var(--border);
      border-radius:8px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:background .2s,border-color .2s;
      flex-shrink:0;color:var(--muted);
    }
    .theme-btn:hover{border-color:var(--border2);color:var(--text)}
    .theme-icon{width:16px;height:16px;fill:currentColor}

    /* ===== HERO ===== */
    #hero{
      position:relative;width:100%;height:500px;
      overflow:hidden;background:var(--bg2);
    }
    #hero.hidden{height:0;overflow:hidden}
    #hero-bg{
      position:absolute;inset:0;
      background-size:cover;background-position:center 20%;
      transition:opacity .8s ease;
    }
    #hero-grad{
      position:absolute;inset:0;
      background:
        linear-gradient(to right, rgba(8,9,12,.97) 28%, rgba(8,9,12,.5) 60%, rgba(8,9,12,.2) 100%),
        linear-gradient(to top, var(--bg) 0%, transparent 35%);
    }
    [data-theme="light"] #hero-grad{
      background:
        linear-gradient(to right,rgba(248,248,251,.97) 28%,rgba(248,248,251,.5) 60%,rgba(248,248,251,.2) 100%),
        linear-gradient(to top,var(--bg) 0%,transparent 35%);
    }
    #hero-content{
      position:relative;z-index:2;
      height:100%;max-width:1280px;margin:0 auto;
      padding:0 32px;
      display:flex;flex-direction:column;
      justify-content:center;gap:16px;
      padding-top:60px;
    }
    #hero-eyebrow{
      font-family:'JetBrains Mono',monospace;
      font-size:11px;letter-spacing:.2em;
      text-transform:uppercase;color:var(--red);
      display:flex;align-items:center;gap:8px;
    }
    #hero-eyebrow::before{
      content:'';width:24px;height:1px;
      background:var(--red);display:block;
    }
    #hero-title{
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(42px,6vw,78px);
      letter-spacing:.04em;line-height:.95;
      max-width:580px;
    }
    #hero-meta{
      display:flex;align-items:center;
      gap:0;
    }
    .h-score{
      font-family:'JetBrains Mono',monospace;
      font-size:13px;font-weight:500;
      color:var(--gold);
      display:flex;align-items:center;gap:5px;
      padding-right:16px;
      border-right:1px solid var(--border2);
    }
    .h-score svg{width:12px;height:12px;fill:var(--gold)}
    .h-year{
      font-family:'JetBrains Mono',monospace;
      font-size:12px;color:var(--muted);
      padding:0 16px;
      border-right:1px solid var(--border2);
    }
    .h-genres-inline{
      display:flex;gap:8px;padding-left:16px;
    }
    .h-gi{
      font-family:'JetBrains Mono',monospace;
      font-size:11px;letter-spacing:.08em;
      text-transform:uppercase;color:var(--muted);
    }
    #hero-overview{
      font-size:14px;line-height:1.8;
      color:var(--muted);max-width:480px;font-weight:300;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    }
    .hero-btns{display:flex;gap:10px;margin-top:4px}
    .h-btn{
      background:var(--red);color:#fff;border:none;
      border-radius:8px;padding:11px 28px;
      font-family:'Outfit',sans-serif;
      font-size:13px;font-weight:600;
      letter-spacing:.06em;text-transform:uppercase;
      cursor:pointer;
      transition:background .2s,box-shadow .2s;
    }
    .h-btn:hover{
      background:var(--red-l);
      box-shadow:0 6px 24px rgba(232,64,42,.4);
    }
    .h-btn-ghost{
      background:transparent;
      border:1px solid var(--border2);
      color:var(--text);border-radius:8px;
      padding:11px 28px;
      font-family:'Outfit',sans-serif;
      font-size:13px;font-weight:500;
      letter-spacing:.04em;
      cursor:pointer;
      transition:border-color .2s,background .2s;
    }
    .h-btn-ghost:hover{
      border-color:var(--red);
      background:rgba(232,64,42,.06);
    }

    /* Hero dots */
    #hero-dots{
      position:absolute;bottom:24px;left:50%;
      transform:translateX(-50%);
      display:flex;gap:6px;z-index:3;
    }
    .dot{
      width:24px;height:3px;
      background:var(--muted2);border-radius:2px;
      cursor:pointer;transition:all .3s;
    }
    .dot.on{background:var(--red);width:36px}

    /* ===== MAIN ===== */
    main{
      max-width:1280px;margin:0 auto;
      padding:40px 32px 80px;
    }

    .sec-hdr{
      display:flex;align-items:baseline;
      justify-content:space-between;
      margin-bottom:28px;
    }
    .sec-title{
      font-family:'Bebas Neue',sans-serif;
      font-size:28px;letter-spacing:.08em;
      color:var(--text);
    }
    .sec-title span{color:var(--red)}
    .res-count{
      font-family:'JetBrains Mono',monospace;
      font-size:12px;color:var(--muted);
    }

    .err-msg{
      display:none;
      background:rgba(232,64,42,.06);
      border:1px solid rgba(232,64,42,.18);
      color:#FF6B57;border-radius:10px;
      padding:16px 20px;font-size:14px;margin-bottom:24px;
      font-family:'JetBrains Mono',monospace;
    }
    .loader{
      display:none;justify-content:center;
      align-items:center;gap:14px;
      padding:80px 0;
      color:var(--muted);
      font-family:'JetBrains Mono',monospace;font-size:13px;
    }
    .spin{
      width:20px;height:20px;
      border:2px solid var(--border2);
      border-top-color:var(--red);
      border-radius:50%;
      animation:spin .7s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ===== GRID ===== */
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
      gap:20px;
    }

    .mc{
      background:var(--card-bg);
      border:1px solid var(--border);
      border-radius:12px;overflow:hidden;cursor:pointer;
      transition:transform .25s,border-color .25s,box-shadow .25s;
      position:relative;
    }
    .mc:hover{
      transform:translateY(-6px);
      border-color:rgba(232,64,42,.35);
      box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 0 1px rgba(232,64,42,.1);
    }
    .pw{
      position:relative;width:100%;padding-top:148%;
      background:var(--bg3);overflow:hidden;
    }
    .pw img{
      position:absolute;inset:0;width:100%;height:100%;
      object-fit:cover;transition:transform .35s;
    }
    .mc:hover .pw img{transform:scale(1.06)}
    .pp{
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      color:var(--muted2);
      font-family:'Bebas Neue',sans-serif;
      font-size:28px;letter-spacing:.1em;
    }

    /* Score badge */
    .sb{
      position:absolute;top:10px;right:10px;
      background:rgba(8,9,12,.9);
      backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,.08);
      border-radius:6px;padding:4px 8px;
      font-family:'JetBrains Mono',monospace;
      font-size:12px;font-weight:500;
      display:flex;align-items:center;gap:4px;
    }
    .sb svg{width:10px;height:10px;fill:currentColor}
    .sb.good{color:#22C55E}.sb.mid{color:#EAB308}.sb.bad{color:#FF6B57}

    .mi{padding:14px 14px 16px}
    .mt{
      font-family:'Outfit',sans-serif;
      font-size:14px;font-weight:600;
      line-height:1.3;margin-bottom:6px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      color:var(--text);
    }
    .mm{display:flex;align-items:center;justify-content:space-between;gap:4px}
    .my{
      font-family:'JetBrains Mono',monospace;
      font-size:11px;color:var(--muted);
    }
    .gt{
      font-family:'JetBrains Mono',monospace;
      font-size:10px;letter-spacing:.04em;text-transform:uppercase;
      background:rgba(232,64,42,.1);
      color:var(--red-l);
      padding:2px 7px;border-radius:4px;
    }

    /* ===== MODAL ===== */
    .overlay{
      display:none;position:fixed;inset:0;
      background:rgba(0,0,0,.85);
      backdrop-filter:blur(16px);
      z-index:200;
      align-items:center;justify-content:center;
      padding:24px;
    }
    .overlay.open{display:flex}
    .modal{
      background:var(--bg2);
      border:1px solid var(--border2);
      border-radius:20px;
      max-width:720px;width:100%;
      max-height:88vh;overflow-y:auto;
      display:flex;
      animation:pop .28s cubic-bezier(.34,1.56,.64,1);
      position:relative;
    }
    @keyframes pop{
      from{transform:scale(.88) translateY(20px);opacity:0}
      to{transform:scale(1) translateY(0);opacity:1}
    }
    .mp{
      width:220px;flex-shrink:0;
      background:var(--bg3);
      border-radius:20px 0 0 20px;
      overflow:hidden;position:relative;
    }
    .mp img{width:100%;height:100%;object-fit:cover}
    .mpp{
      width:100%;height:100%;min-height:320px;
      display:flex;align-items:center;justify-content:center;
      font-family:'Bebas Neue',sans-serif;
      font-size:32px;letter-spacing:.1em;
      color:var(--muted2);
    }
    .mb{
      padding:28px 32px;flex:1;
      display:flex;flex-direction:column;gap:16px;
    }
    .mc-close{
      position:absolute;top:16px;right:16px;
      background:var(--bg3);border:1px solid var(--border);
      color:var(--muted);width:32px;height:32px;
      border-radius:8px;font-size:14px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:color .2s,background .2s;z-index:2;
    }
    .mc-close:hover{color:var(--text);background:var(--bg4)}

    .m-eyebrow{
      font-family:'JetBrains Mono',monospace;
      font-size:10px;letter-spacing:.2em;
      text-transform:uppercase;color:var(--red);
    }
    .m-title{
      font-family:'Bebas Neue',sans-serif;
      font-size:32px;letter-spacing:.05em;line-height:1;
      color:var(--text);
    }
    .m-tagline{
      font-size:13px;color:var(--muted);
      font-style:italic;font-weight:300;
    }
    .m-stats{display:flex;gap:10px;flex-wrap:wrap}
    .m-stat{
      background:var(--bg3);
      border:1px solid var(--border);
      border-radius:8px;padding:10px 14px;
      font-family:'JetBrains Mono',monospace;
      font-size:11px;color:var(--muted);
      text-transform:uppercase;letter-spacing:.06em;
      min-width:72px;
    }
    .m-stat b{
      color:var(--text);display:block;
      font-size:18px;margin-bottom:3px;
      font-family:'Bebas Neue',sans-serif;
      letter-spacing:.04em;font-weight:400;
    }
    .m-genres{display:flex;gap:7px;flex-wrap:wrap}
    .m-genre{
      font-family:'JetBrains Mono',monospace;
      font-size:11px;letter-spacing:.06em;
      text-transform:uppercase;
      border:1px solid var(--border2);
      color:var(--muted);
      padding:4px 12px;border-radius:20px;
      transition:border-color .2s,color .2s;
    }
    .m-genre:hover{border-color:var(--red);color:var(--red-l)}
    .m-sep{
      height:1px;background:var(--border);
      margin:2px 0;
    }
    .m-overview{
      font-size:14px;line-height:1.8;
      color:var(--muted);font-weight:300;
    }

    /* ===== FOOTER ===== */
    footer{
      text-align:center;padding:0 24px 40px;
      font-family:'JetBrains Mono',monospace;
      font-size:12px;color:var(--muted);
      letter-spacing:.04em;
    }
    footer span{color:var(--red)}

    /* ===== RESPONSIVE ===== */
    @media(max-width:700px){
      .hdr{padding:0 16px;gap:12px}
      .logo-name{display:none}
      main{padding:28px 16px 60px}
      #hero-content{padding:0 16px;padding-top:40px}
      #hero{height:400px}
      .modal{flex-direction:column;max-height:92vh}
      .mp{width:100%;height:220px;border-radius:20px 20px 0 0}
      .mb{padding:20px}
      .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
    }
  </style>
</head>
<body>

<header>
  <div class="hdr">
    <a class="logo" href="#">
      <div class="logo-mark">RB</div>
      <div class="logo-name">RB<span>CINE</span></div>
    </a>

    <div class="divider"></div>

    <div class="tabs">
      <button class="tab on" onclick="switchType('movie',this)">Films</button>
      <button class="tab"    onclick="switchType('tv',this)">Séries</button>
    </div>

    <div class="search-row">
      <input id="s-input" type="text" placeholder="Titanic, Breaking Bad..."/>
      <button onclick="doSearch()">Chercher</button>
    </div>

    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Thème">
      <svg id="theme-icon" class="theme-icon" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z"/>
      </svg>
    </button>
  </div>
</header>

<div id="hero">
  <div id="hero-bg"></div>
  <div id="hero-grad"></div>
  <div id="hero-content">
    <div id="hero-eyebrow">En ce moment</div>
    <div id="hero-title">—</div>
    <div id="hero-meta">
      <div class="h-score">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span id="h-score">—</span>
      </div>
      <div class="h-year" id="h-year">—</div>
      <div class="h-genres-inline" id="h-genres-inline"></div>
    </div>
    <div id="hero-overview"></div>
    <div class="hero-btns">
      <button class="h-btn" id="h-details-btn">Voir les détails</button>
      <button class="h-btn-ghost" onclick="nextHero()">Suivant</button>
    </div>
  </div>
  <div id="hero-dots"></div>
</div>

<main>
  <div class="sec-hdr">
    <div class="sec-title" id="sec-title">Films <span>Tendance</span></div>
    <div class="res-count" id="res-count"></div>
  </div>

  <div class="err-msg" id="err">Aucun résultat — essaie un autre titre.</div>
  <div class="loader" id="loader"><div class="spin"></div>Chargement...</div>
  <div class="grid" id="grid"></div>
</main>

<footer>Données TMDB &nbsp;·&nbsp; Projet perso &nbsp;·&nbsp; <span>Rayane B.</span></footer>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="mp" id="m-poster"></div>
    <div class="mb">
      <button class="mc-close" onclick="document.getElementById('overlay').classList.remove('open')">✕</button>
      <div class="m-eyebrow" id="m-eyebrow">Film</div>
      <div class="m-title"    id="m-title"></div>
      <div class="m-tagline"  id="m-tagline"></div>
      <div class="m-stats"    id="m-stats"></div>
      <div class="m-genres"   id="m-genres"></div>
      <div class="m-sep"></div>
      <div class="m-overview" id="m-overview"></div>
    </div>
  </div>
</div>

<script>


  let type     = 'movie';
  let genres   = {};
  let heroList = [];
  let heroIdx  = 0;
  let heroTimer;

  // ── Theme ──
  let isDark = true;
  function toggleTheme(){
    isDark = !isDark;
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    const icon = $('theme-icon');
    icon.innerHTML = isDark
      ? '<path d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z"/>'
      : '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  }

  // ── Tab switch ──
  async function switchType(t, btn){
    type = t;
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    $('s-input').value = '';
    const label = type === 'movie' ? 'Films' : 'Séries';
    $('sec-title').innerHTML = `${label} <span>Tendance</span>`;
    $('hero').classList.remove('hidden');
    await fetchGenres();
    loadTrending();
  }

  // ── Genres ──
  async function fetchGenres(){
    const r = await fetch(`${BASE}/genre/${type}/list?api_key=${KEY}&language=fr-FR`);
    const d = await r.json();
    genres = {};
    (d.genres||[]).forEach(g => genres[g.id] = g.name);
  }

  function sc(v){ return v>=7?'good':v>=5?'mid':'bad'; }

  // ── Hero ──
  function buildDots(){
    const dots = $('hero-dots');
    dots.innerHTML = '';
    const count = Math.min(heroList.length, 8);
    for(let i=0;i<count;i++){
      const d = document.createElement('div');
      d.className = 'dot' + (i===heroIdx?' on':'');
      d.onclick = () => { heroIdx=i; showHero(heroList[i]); };
      dots.appendChild(d);
    }
  }

  function showHero(item){
    if(!item) return;
    const bg  = item.backdrop_path ? `${BIG}${item.backdrop_path}` : '';
    const ttl = item.title || item.name || '';
    const yr  = (item.release_date||item.first_air_date||'').slice(0,4);
    const gs  = (item.genre_ids||[]).slice(0,3)
      .map(id => `<span class="h-gi">${genres[id]||''}</span>`)
      .join('<span style="color:var(--muted2);padding:0 6px">·</span>');

    if(bg){
      const heroEl = $('hero-bg');
      heroEl.style.opacity = '0';
      setTimeout(()=>{
        heroEl.style.backgroundImage = `url(${bg})`;
        heroEl.style.opacity = '1';
        heroEl.style.transition = 'opacity .6s ease';
      }, 150);
    }
    $('hero-title').textContent    = ttl;
    $('h-score').textContent       = item.vote_average ? item.vote_average.toFixed(1) : '—';
    $('h-year').textContent        = yr;
    $('h-genres-inline').innerHTML = gs;
    $('hero-overview').textContent = item.overview || '';
    $('h-details-btn').onclick     = () => openModal(item.id);

    // update dots
    document.querySelectorAll('.dot').forEach((d,i) => {
      d.classList.toggle('on', i===heroIdx);
    });

    clearTimeout(heroTimer);
    heroTimer = setTimeout(nextHero, 7000);
  }

  function nextHero(){
    if(!heroList.length) return;
    heroIdx = (heroIdx + 1) % Math.min(heroList.length, 8);
    showHero(heroList[heroIdx]);
  }

  // ── Trending ──
  async function loadTrending(){
    showLoader();
    try{
      const r = await fetch(`${BASE}/trending/${type}/week?api_key=${KEY}&language=fr-FR`);
      const d = await r.json();
      heroList = d.results || [];
      heroIdx  = 0;
      buildDots();
      showHero(heroList[0]);
      renderGrid(heroList);
      $('res-count').textContent = heroList.length + ' résultats';
    }catch{ showErr(); }
  }

  // ── Search ──
  async function doSearch(){
    const q = $('s-input').value.trim();
    if(!q){ loadTrending(); return; }
    const label = type === 'movie' ? 'Films' : 'Séries';
    $('sec-title').innerHTML = `${label} <span>"${q}"</span>`;
    $('hero').classList.add('hidden');
    clearTimeout(heroTimer);
    showLoader();
    try{
      const r = await fetch(`${BASE}/search/${type}?api_key=${KEY}&language=fr-FR&query=${encodeURIComponent(q)}`);
      const d = await r.json();
      if(!d.results?.length){ showErr(); return; }
      renderGrid(d.results);
      $('res-count').textContent = d.results.length + ' résultats';
    }catch{ showErr(); }
  }
  $('s-input').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });

  // ── Cards ──
  function renderGrid(items){
    $('loader').style.display = 'none';
    $('err').style.display    = 'none';
    const g = $('grid');
    g.innerHTML = '';
    items.slice(0,20).forEach(item=>{
      const title = item.title || item.name || 'Sans titre';
      const year  = (item.release_date||item.first_air_date||'').slice(0,4);
      const score = item.vote_average ? item.vote_average.toFixed(1) : '—';
      const gName = item.genre_ids?.[0] ? (genres[item.genre_ids[0]]||'') : '';
      const img   = item.poster_path
        ? `<img src="${IMG}${item.poster_path}" alt="${title}" loading="lazy"/>`
        : `<div class="pp">NO<br>IMAGE</div>`;

      const card = document.createElement('div');
      card.className = 'mc';
      card.innerHTML = `
        <div class="pw">
          ${img}
          <div class="sb ${sc(item.vote_average)}">
            <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            ${score}
          </div>
        </div>
        <div class="mi">
          <div class="mt" title="${title}">${title}</div>
          <div class="mm">
            <div class="my">${year}</div>
            ${gName?`<div class="gt">${gName}</div>`:''}
          </div>
        </div>`;
      card.onclick = () => openModal(item.id);
      g.appendChild(card);
    });
  }

  // ── Modal ──
  async function openModal(id){
    const r = await fetch(`${BASE}/${type}/${id}?api_key=${KEY}&language=fr-FR`);
    const d = await r.json();

    const title   = d.title || d.name;
    const year    = (d.release_date||d.first_air_date||'').slice(0,4);
    const runtime = d.runtime
      ? `${d.runtime} min`
      : (d.episode_run_time?.[0] ? `${d.episode_run_time[0]} min/ép.` : '—');
    const poster  = d.poster_path
      ? `<img src="${IMG}${d.poster_path}" alt="${title}"/>`
      : `<div class="mpp">NO IMAGE</div>`;

    $('m-poster').innerHTML    = poster;
    $('m-eyebrow').textContent = type === 'movie' ? 'Film' : 'Série';
    $('m-title').textContent   = title;
    $('m-tagline').textContent = d.tagline || '';
    $('m-tagline').style.display = d.tagline ? 'block' : 'none';
    $('m-overview').textContent  = d.overview || 'Aucune description disponible.';
    $('m-stats').innerHTML = `
      <div class="m-stat"><b>${d.vote_average?.toFixed(1)||'—'}/10</b>Note</div>
      <div class="m-stat"><b>${(d.vote_count||0).toLocaleString()}</b>Votes</div>
      <div class="m-stat"><b>${year}</b>Année</div>
      <div class="m-stat"><b>${runtime}</b>Durée</div>`;
    $('m-genres').innerHTML = (d.genres||[])
      .map(g=>`<span class="m-genre">${g.name}</span>`).join('');
    $('overlay').classList.add('open');
  }

  function closeModal(e){
    if(e.target === $('overlay')) $('overlay').classList.remove('open');
  }

  function showLoader(){
    $('grid').innerHTML='';$('err').style.display='none';
    $('loader').style.display='flex';$('res-count').textContent='';
  }
  function showErr(){
    $('loader').style.display='none';$('grid').innerHTML='';
    $('err').style.display='block';$('res-count').textContent='';
  }

  (async()=>{ await fetchGenres(); loadTrending(); })();
</script>
</body>
</html>
